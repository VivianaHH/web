<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta charset="iso-8859-1">
    <meta name="description" content="Ejemplo html5">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-esclabable=no, maximum-escale=1.0, minimum-scale=1.0 ">

    <title>Animacion de texto e imagenes</title>
    <script src="modernizr.min.js"></script>
    <link rel="stylesheet" type="text/css" href="estilos/animate.css">
    <link rel="stylesheet" type="text/css" href="estilos/base.css">
</head>
<body>

    <div class="header">
        <h1 class="animate__animated animate__bounceIn animate__infinite infinite">
            Animacion css
        </h1>
    </div>

    <div class="animate__animated animate__fadeInTopRight animate__infinite infinite">
        <a href="https://www.GOOGLE.com">GOOGLE</a>
        <br><br>
    </div>

    <div class="animate__animated animate__zoomInUp animate__infinite infinite animate__delay-2s">
        <img src="imagenes/4.webp" width="400" height="430">
        <img src="imagenes/3.avif" width="360" height="430">
    </div>
    
    <footer>
        <p>&copy;Viviana Hernández Hernández</p>
        <b class="animate__animated animate__flash animate__infinite infinite">Todos los derechos reservados </b>
    </footer>
    
    
</body>
</html>
