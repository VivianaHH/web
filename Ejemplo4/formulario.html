<!DOCTYPE html>

<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta charset="iso-8859-1">
        <meta name="description" content="Ejemplo HTML5">
        <meta name="keywords" content="HTML5, CSS3, JavaScript">
        <title> Registro de Usuarios</title>
        <script src="modernizr.min.js"></script>
        <link rel="stylesheet" href="estilos/estiloF.css">
    
    </head>

<body>
    
    <fieldset id="registrousuario">
        <form>
          <legend>Registro de Nuevo Usuario</legend>
          <label>Usuario:</label>
          <input type="text" name="username" class="texto" size="20" placeholder="Escribe usuario"/>
          <label>Contraseña:</label>
          <input type="password" name="password" class="texto" size="20" placeholder="Escribe contraseña"/>
          <label>Correo Electronico:</label>
          <input type="email" name="correo" class="texto" size="20" placeholder="Escribe correo"/>
          <label>Nombres: </label>
          <input type="text" name="nombre" class="texto" size="20" placeholder="Escribe nombres"/>
          <label>Apellidos: </label>
          <input type="text" name="Apellidos" class="texto" size="20" placeholder="Escribe Apellidos"/>
          <label>Direccion:</label>
          <input type="text" name="Direccion" class="texto" size="20" placeholder="Escribe Direccion"/>
          <label>Fecha de Nacimiento:</label>
          <input type="date" name="fechaN" class="texto" size="20" placeholder="Fecha de Nac"/>
          <label>Comentarios:</label>
          <textarea class="areadetexto" name="comentarios" cols="5" rows="10"></textarea>
          <input type="submit" name="enviar" class="botonenviar" value="Enviar"  />
        </form>
    </fieldset>
</body>
</html>
