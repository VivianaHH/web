<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Animated Login & Registration Form | Codehal</title>
    <link rel="stylesheet" type="text/css" href="css/estilo.css">
</head>

<body>

    <div class="wrapper">
        <div class="form-wrapper sign-in">
            <form action="Iniciar.php" method="post">        <!-- Aqui se escribe el enlance php que ara el registro -->
                <h2>Login</h2>
                <div class="input-group">
                    <input name="username" type="text" required>
                    <label for="">Username</label>
                </div>
                <div class="input-group">
                    <input name="password" type="password" required>
                    <label for="">Password</label>
                </div>
                <div class="remember">
                    <label><input type="checkbox"> Remember me</label>
                </div>
                <button type="submit">Login</button>
                <div class="signUp-link">
                    <p>Don't have an account? <a href="#" class="signUpBtn-link">Sign Up</a></p>
                </div>
            </form>
        </div>

        <div class="form-wrapper sign-up">
            <form action="registro.php" method="post">            <!-- Aqui se escribe el enlance php que ara la parte de iniciar sesion -->
                <h2>Sign up</h2>
                <div class="input-group">
                    <input name="username" type="text" required>
                    <label for="">Username</label>
                </div>
                <div class="input-group">
                    <input name="password" type="password" required>
                    <label for="">Password</label>
                </div>
                <div class="input-group">
                    <input name="email" type="email" required>
                    <label for="">Email</label>
                </div>
                <div class="remember">
                    <label><input type="checkbox"> I agree to the
                        terms & conditions</label>
                </div>
                <button type="submit">Sign Up</button>
                <div class="signUp-link">
                    <p>Already have an account? <a href="#" class="signInBtn-link">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
