
<!DOCTYPE html>
<html lang="es-ES">

<head>
    <meta charset="utf-8">
    <meta charset="iso-8859-1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Imagenes Responsive de HTML5">
    <meta name="keywords" content="HTML5, CSS3, JavaScript">
    <meta name="viewport" content="widht-device-width; initial-scale-1.0">
    
       <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity=" sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJ0Z" crossorigin="anonymous">
       <link rel="stylesheet" type="text/css" href="css/estilo.css">
 <title>Formulario de Contacto</title>
</head>

<body>
    
    <div class="container">
    <div class="row">
   
   <h1>Formulario de contacto</h1>
   
   <form id="form">
   <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Nombre:</label>
    <input type="text" class="form-control" placeholder="Nombre" name="Nombre" required>
  </div>

  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label" >Apellidos:</label>
    <input type="text" class="form-control" placeholder="Apellidos" name="Apellidos" required>
  </div>
  
<div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Teléfono:</label>
    <input type="number" class="form-control" placeholder="Teléfono" name="Telefono" required>
   </div>
   
<div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Correo Electrónico:</label>
    <input type="email" class="form-control" placeholder="Email" name="Email" required>
   </div>
    
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Mensaje:</label>
    <textarea type="text" class="form-control" placeholder="Mensaje" name="Mensaje" required></textarea>
  </div>
  
  <input type="submit" class="btn btn-success" id="button" value="ENVIAR MENSAJE" >
</form>
    
<script type="text/javascript"
  src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script type="text/javascript">
  emailjs.init('cdfyXymT24RB5KtFG')
</script>
      </div>
    </div>
    
</body>
    
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.7/dist/umd/popper.min.js" integrity="
sha384-zYPOMqeu1DAVkHiLqWBUTcbYfZ8osu1Nd6Z891fy25QV9guujx43ITvfi12/QExE" crossorigin="anonymous"></script>
    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.min.js" integrity="
sha384-Y4o0pwW3duJdCWv5ly8SCFYWqFDsfob/3GkgExXKV4idmbt98QcxXYs9UoXAB7BZ" crossorigin="anonymous"></script>

<script>

  const btn = document.getElementById('button');

document.getElementById('form')
 .addEventListener('submit', function(event) {
    event.preventDefault();
    
    btn.value= 'Enviando...';
    
    const serviceID= 'default_service';
    const templateID= 'template_ykmredi';
    
    emailjs.sendForm (serviceID, templateID, this)
    .then(() => {
      btn.value= 'ENVIAR MENSAJE';
      alert('Mensaje Enviado correctamente!');
    }, (err) => {
      btn.value= 'ENVIAR MENSAJE';
      alert(JSON.stringify(err));
    });
});

</script>

<script>
  document.addEventListener('DOMContentLoaded', function(){
    let formulario = document.getElementById('form');
    formulario.addEventListener('submit', function() {
        formulario.reset();
    });
});


</script>
